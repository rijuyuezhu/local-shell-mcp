name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            vscode-extension/package-lock.json
            ui-terminal/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pyright

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - if: runner.os != 'Windows'
        run: uv run pytest -q
      - if: runner.os == 'Windows'
        run: uv run pytest -vv --tb=short --durations=20


  opentui:
    name: OpenTUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: ui-opentui
        run: bun install --frozen-lockfile
      - working-directory: ui-opentui
        run: bun run typecheck
      - working-directory: ui-opentui
        run: bun test
      - working-directory: ui-opentui
        run: bun run build:tui
      - name: Smoke test OpenTUI sidecar
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./ui-opentui/dist/local-shell-mcp-tui.exe --version
          else
            ./ui-opentui/dist/local-shell-mcp-tui --version
          fi

  windows-conpty:
    name: Windows ConPTY
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: >-
          uv run pytest -q
          tests/test_conpty_backend.py
          tests/test_conpty_windows_integration.py
          tests/test_terminal_bridge.py

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - name: Validate source distribution contents and rebuild
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/local-shell-mcp-sdist /tmp/local-shell-mcp-sdist-wheel
          mkdir -p /tmp/local-shell-mcp-sdist /tmp/local-shell-mcp-sdist-wheel
          tar -xzf dist/*.tar.gz -C /tmp/local-shell-mcp-sdist
          source_dir="$(find /tmp/local-shell-mcp-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$source_dir/ui-terminal/package.json"
          test -f "$source_dir/ui-terminal/package-lock.json"
          test -f "$source_dir/ui-terminal/src/index.js"
          test -f "$source_dir/ui-terminal/scripts/build.mjs"
          test ! -e "$source_dir/ui-terminal/node_modules"
          test -f "$source_dir/ui-opentui/package.json"
          test -f "$source_dir/ui-opentui/bun.lock"
          test -f "$source_dir/ui-opentui/src/tui.tsx"
          test -f "$source_dir/ui-opentui/scripts/compile-tui.ts"
          test ! -e "$source_dir/ui-opentui/node_modules"
          test ! -e "$source_dir/ui-opentui/dist"
          uv build --wheel "$source_dir" --out-dir /tmp/local-shell-mcp-sdist-wheel
          test -n "$(find /tmp/local-shell-mcp-sdist-wheel -maxdepth 1 -name '*.whl' -print -quit)"
      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv /tmp/local-shell-mcp-wheel-venv
          /tmp/local-shell-mcp-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/local-shell-mcp-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/local-shell-mcp-wheel-venv/bin/local-shell-mcp --version
          /tmp/local-shell-mcp-wheel-venv/bin/local-shell-mcp version

  compose-smoke:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose configuration
        run: |
          cp .env.example .env
          docker compose config

  dockerfile-check:
    name: Dockerfile check (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Check Dockerfile without building image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          call: check

  release-matrix:
    name: Release matrix check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python scripts/check-release-matrix.py

  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - working-directory: vscode-extension
        run: npm ci
      - working-directory: vscode-extension
        run: npm run compile
      - working-directory: vscode-extension
        run: npm run package:vsix
