name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      push_latest:
        description: "Also publish the Docker image with the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: rijuyuezhu/local-shell-mcp
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  PUSH_LATEST: ${{ github.event_name == 'push' || inputs.push_latest }}
  PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

jobs:
  validate-release:
    name: Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      docker_tags: ${{ steps.docker-tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag and read project version
        id: version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v?[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"Release tag must look like v0.2.0 or 0.2.0, got {tag!r}")

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          release_version = tag[1:] if tag.startswith("v") else tag
          if release_version != version:
              raise SystemExit(
                  f"Release tag {tag!r} resolves to version {release_version!r}, "
                  f"but pyproject.toml declares {version!r}"
              )

          print(f"version={version}")
          PY

      - name: Prepare Docker release tags
        id: docker-tags
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PUSH_LATEST: ${{ env.PUSH_LATEST }}
        run: |
          tags=("${IMAGE_NAME}:${RELEASE_TAG}")
          if [[ "${RELEASE_TAG}" == v* ]]; then
            tags+=("${IMAGE_NAME}:${RELEASE_TAG#v}")
          fi
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            tags+=("${IMAGE_NAME}:latest")
          fi

          json="$(printf '%s\n' "${tags[@]}" | jq -R . | jq -sc .)"
          echo "tags=${json}" >> "$GITHUB_OUTPUT"

  build-python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Build wheel and source distribution
        run: uv build

      - name: Inspect universal wheel and source distribution
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from local_shell_mcp.release.platform_wheel import inspect_sdist, inspect_wheel

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one universal wheel and one sdist")
          inspect_wheel(wheels[0], target=None)
          inspect_sdist(sdists[0])
          PY

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-platform-wheel:
    name: Build platform wheel (${{ matrix.artifact }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            runner: ubuntu-latest
            platform_tag: linux_x86_64
          - artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            platform_tag: linux_aarch64
          - artifact: macos-x86_64
            runner: macos-15-intel
            platform_tag: macosx_10_15_x86_64
          - artifact: macos-aarch64
            runner: macos-15
            platform_tag: macosx_11_0_arm64
          - artifact: windows-x86_64
            runner: windows-latest
            platform_tag: win_amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: uv sync --locked --group dev

      - working-directory: ui-opentui
        run: bun install --frozen-lockfile

      - name: Build and inspect platform wheel
        shell: bash
        run: >-
          uv run python scripts/build-platform-wheel.py
          --platform-tag "${{ matrix.platform_tag }}"
          --output-dir dist

      - name: Install wheel without Bun or sidecar
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/platform-wheel-venv"
          state="$RUNNER_TEMP/platform-wheel-state"
          work="$RUNNER_TEMP/platform-wheel-work"
          python -m venv "$venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin="$venv/Scripts/python.exe"
            clean_path="$venv/Scripts"
          else
            python_bin="$venv/bin/python"
            clean_path="$venv/bin"
          fi
          "$python_bin" -m pip install dist/*.whl
          PATH="$clean_path" "$python_bin" \
            "$GITHUB_WORKSPACE/scripts/smoke-platform-wheel.py" \
            --state-dir "$state" \
            --work-dir "$work"
          test ! -e src/local_shell_mcp/ui_runtime
          test ! -e src/local_shell_mcp/.platform-wheel-build.lock

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  build-binary:
    name: Build binary (${{ matrix.artifact }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            runner: ubuntu-latest
            helper_platform: linux/amd64
            helper_tag: linux-x86_64
            binary: local-shell-mcp
            archive: tar.gz
          - artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            helper_platform: linux/arm64
            helper_tag: linux-aarch64
            binary: local-shell-mcp
            archive: tar.gz
          - artifact: macos-x86_64
            runner: macos-15-intel
            binary: local-shell-mcp
            archive: tar.gz
          - artifact: macos-aarch64
            runner: macos-15
            binary: local-shell-mcp
            archive: tar.gz
          - artifact: windows-x86_64
            runner: windows-latest
            binary: local-shell-mcp.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Docker Buildx for bundled tmux
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Build bundled tmux helper
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          scripts/build-tmux-helper.sh
          "src/local_shell_mcp/helpers/${{ matrix.helper_tag }}/tmux"
          "${{ matrix.helper_platform }}"

      - name: Build OpenTUI sidecar
        working-directory: ui-opentui
        run: |
          bun install --frozen-lockfile
          bun run build:tui

      - name: Build self-contained executable
        shell: bash
        run: |
          PYINSTALLER_ARGS=(
            --clean
            --onefile
            --name local-shell-mcp
            --collect-all local_shell_mcp
            --collect-all mcp
            --collect-all uvicorn
            --collect-all fastapi
            --collect-all starlette
            --exclude-module cryptography
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            PYINSTALLER_ARGS+=(--collect-all winpty)
          fi
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            PYINSTALLER_ARGS+=(
              --add-binary
              "src/local_shell_mcp/helpers/${{ matrix.helper_tag }}/tmux:local_shell_mcp/helpers/${{ matrix.helper_tag }}"
            )
          fi
          uv run --with pyinstaller --with typer pyinstaller \
            "${PYINSTALLER_ARGS[@]}" \
            scripts/pyinstaller-entry.py

      - name: Smoke test executables
        shell: bash
        run: |
          ./dist/${{ matrix.binary }} --help
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            uv run --with pyinstaller pyi-archive_viewer "dist/${{ matrix.binary }}" -l |
              grep -F "local_shell_mcp/helpers/${{ matrix.helper_tag }}/tmux"
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./ui-opentui/dist/local-shell-mcp-tui.exe --version
          else
            ./ui-opentui/dist/local-shell-mcp-tui --version
          fi

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/local-shell-mcp-${{ matrix.artifact }}
          cp dist/${{ matrix.binary }} release/local-shell-mcp-${{ matrix.artifact }}/
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp ui-opentui/dist/local-shell-mcp-tui.exe release/local-shell-mcp-${{ matrix.artifact }}/
          else
            cp ui-opentui/dist/local-shell-mcp-tui release/local-shell-mcp-${{ matrix.artifact }}/
          fi
          cp README.md LICENSE release/local-shell-mcp-${{ matrix.artifact }}/
          cp src/local_shell_mcp/helpers/opentui.NOTICES \
            release/local-shell-mcp-${{ matrix.artifact }}/OPENTUI-NOTICES.txt
          cp src/local_shell_mcp/helpers/bun-1.3.14.LICENSE.md \
            release/local-shell-mcp-${{ matrix.artifact }}/BUN-1.3.14-LICENSE.md
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cp src/local_shell_mcp/helpers/tmux.LICENSE \
              release/local-shell-mcp-${{ matrix.artifact }}/TMUX-LICENSE.txt
          fi
          cat > release/local-shell-mcp-${{ matrix.artifact }}/QUICKSTART.txt <<'EOF'
          Start local-shell-mcp without Docker:

            ./local-shell-mcp --mode mcp

          In another terminal, open the native terminal UI:

            ./local-shell-mcp tui

          Useful environment variables:

            LOCAL_SHELL_MCP_HOST=0.0.0.0
            LOCAL_SHELL_MCP_PORT=8765
            LOCAL_SHELL_MCP_WORKSPACE_ROOT=/path/to/workspace
            LOCAL_SHELL_MCP_AUTH_MODE=oauth
            LOCAL_SHELL_MCP_PUBLIC_BASE_URL=https://your-public-host.example.com
            LOCAL_SHELL_MCP_OAUTH_ADMIN_PIN=change-me
            LOCAL_SHELL_MCP_OAUTH_JWT_SECRET=change-me-64-hex-random-secret
          EOF
          cd release
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a local-shell-mcp-${{ matrix.artifact }}.zip local-shell-mcp-${{ matrix.artifact }} >/dev/null
          else
            tar -czf local-shell-mcp-${{ matrix.artifact }}.tar.gz local-shell-mcp-${{ matrix.artifact }}
          fi

      - name: Generate binary checksums
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum local-shell-mcp-${{ matrix.artifact }}.* > local-shell-mcp-${{ matrix.artifact }}.sha256
          else
            shasum -a 256 local-shell-mcp-${{ matrix.artifact }}.* > local-shell-mcp-${{ matrix.artifact }}.sha256
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact }}
          path: |
            release/local-shell-mcp-${{ matrix.artifact }}.*
          if-no-files-found: error


  build-vscode-extension:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Sync extension version from release tag
        working-directory: vscode-extension
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package:vsix

      - name: Generate VSIX checksum
        shell: bash
        run: |
          cd dist
          sha256sum local-shell-mcp-vscode-*.vsix > local-shell-mcp-vscode.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: |
            dist/local-shell-mcp-vscode-*.vsix
            dist/local-shell-mcp-vscode.sha256
          if-no-files-found: error


  publish-docker-platform:
    name: Publish Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare platform tags
        id: platform-tags
        env:
          DOCKER_TAGS_JSON: ${{ needs.validate-release.outputs.docker_tags }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          tags = json.loads(os.environ["DOCKER_TAGS_JSON"])
          suffix = os.environ["SUFFIX"]
          print("tags<<EOF")
          for tag in tags:
              print(f"{tag}-{suffix}")
          print("EOF")
          PY

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.platform-tags.outputs.tags }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}

  publish-docker-manifest:
    name: Publish Docker manifest
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - publish-docker-platform
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          DOCKER_TAGS_JSON: ${{ needs.validate-release.outputs.docker_tags }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          tags = json.loads(os.environ["DOCKER_TAGS_JSON"])
          for tag in tags:
              subprocess.run(
                  [
                      "docker",
                      "buildx",
                      "imagetools",
                      "create",
                      "-t",
                      tag,
                      f"{tag}-amd64",
                      f"{tag}-arm64",
                  ],
                  check=True,
              )
          PY

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - build-python-package
      - build-platform-wheel
      - build-binary
      - build-vscode-extension
      - publish-docker-manifest
    steps:
      - uses: actions/checkout@v6

      - name: Download Python package artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Download platform wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Download VS Code extension artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: dist

      - name: Create combined checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          Docker image:

          \`\`\`bash
          docker pull ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          \`\`\`

          Docker platforms are built in parallel and published as a multi-arch manifest:

          \`\`\`text
          linux/amd64
          linux/arm64
          \`\`\`

          Embedded-OpenTUI Python wheels are attached for:

          \`\`\`text
          linux-x86_64
          linux-aarch64
          macos-x86_64
          macos-aarch64
          windows-x86_64
          \`\`\`

          Linux wheels use truthful native \`linux_*\` tags; they do not claim manylinux compatibility.
          The universal \`py3-none-any\` wheel and source distribution remain payload-free.

          All-in-one executable downloads are attached for:

          \`\`\`text
          linux-x86_64
          linux-aarch64
          macos-x86_64
          macos-aarch64
          windows-x86_64
          \`\`\`

          Start without Docker:

          \`\`\`bash
          ./local-shell-mcp --mode mcp
          \`\`\`

          VS Code extension download:

          \`\`\`text
          local-shell-mcp-vscode-${{ needs.validate-release.outputs.version }}.vsix
          \`\`\`

          Universal and platform Python package artifacts, executable archives, VS Code extension, and SHA256 checksums are attached below.

          Python package version in \`pyproject.toml\`: \`${{ needs.validate-release.outputs.version }}\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: dist/*
