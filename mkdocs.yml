site_name: local-shell-mcp
site_description: ChatGPT-compatible OAuth MCP server for controlled local shell and filesystem access
site_url: https://project.rijuyuezhu.top/local-shell-mcp/
repo_url: https://github.com/rijuyuezhu/local-shell-mcp
repo_name: rijuyuezhu/local-shell-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  language: en

  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Getting started: 快速开始
            Quickstart: 快速开始
            Cloudflare Tunnel: Cloudflare Tunnel
            ChatGPT connector: ChatGPT 连接器
            Install options: 安装方式
            Docker Compose: Docker Compose
            VS Code: VS Code
            Guides: 指南
            Common workflows: 常见工作流
            Human interface: 人机界面
            Remote workers: 远程工作节点
            Agent capability bridge: Agent 能力桥
            Audit log: 审计日志
            Example prompts: 示例提示词
            Reference: 参考
            Configuration: 配置
            CLI: 命令行
            Tools: 工具
            MCP server instructions: MCP 服务器指令
            Security: 安全
            Troubleshooting: 故障排查
            Development: 开发
            Maintenance: 维护
            Upstream commit review: 上游提交审查
            Community: 社区
            Contributing: 贡献指南
            Support: 支持
            Security policy: 安全策略
            Code of conduct: 行为准则

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - assets/reference-renderer.js

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Cloudflare Tunnel: getting-started/cloudflare-tunnel.md
      - ChatGPT connector: getting-started/chatgpt-connector.md
      - Install options: getting-started/install-options.md
      - Docker Compose: getting-started/docker-compose.md
      - VS Code: getting-started/vscode.md
  - Guides:
      - Common workflows: guides/common-workflows.md
      - Human interface: guides/human-interface.md
      - Remote workers: guides/remote-workers.md
      - Agent capability bridge: guides/agent-bridge.md
      - Audit log: guides/audit-log.md
      - Example prompts: guides/example-prompts.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - Tools: reference/tools.md
      - MCP server instructions: reference/instructions.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Maintenance:
      - Upstream commit review: maintenance/upstream-commit-review.md
  - Community:
      - Contributing: community/contributing.md
      - Support: community/support.md
      - Security policy: community/security-policy.md
      - Code of conduct: community/code-of-conduct.md
